  <!-- CSS Files -->
  <link rel="stylesheet" href="../css/root.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="style.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MUMSA | Contact Us",
      "url": "index.html"
    }
  </script>
</head>

<body>

  <div class="body-overlay js-body-overlay"></div>

  <header class="navbar js-desktop-navbar">
    <!-- Code to be injected by the JavaScript Desktop Navbar component -->
  </header>

  <div class="js-mobile-navbar">
    <!-- Code to be injected by the JavaScript Mobile Navbar component -->
  </div>

  <main>

    <!-- ── Hero ─────────────────────────────── -->
    <section class="section contact-hero-section">
      <div class="contact-hero-container">
        <h1>Get in Touch</h1>
        <p data-nosnippet>Questions, partnerships, or membership requests &mdash; reach out and we'll respond as soon as possible.</p>
      </div>
    </section>

    <!-- ── WIP Alert ─────────────────────────── -->
    <div class="contact-wip-banner">
      <div class="contact-wip-inner">
        <div class="wip-icon">
          <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
        </div>
        <p>This form is currently under development.</p>
      </div>
    </div>

    <!-- ── Form + Info ────────────────────────── -->
    <section class="section contact-body-section">
      <div class="contact-layout">

        <!-- Form -->
        <div class="contact-form-card">
          <h2>Send a Message</h2>

          <form class="contact-form" action="index.html#" method="post">
            <div class="field-row">
              <div class="field">
                <label for="cName">Name</label>
                <input id="cName" name="name" placeholder="Your name" required autocomplete="name" />
              </div>
              <div class="field">
                <label for="cEmail">Email</label>
                <input id="cEmail" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
              </div>
            </div>
            <div class="field">
              <label for="cSubject">Subject</label>
              <input id="cSubject" name="subject" placeholder="How can we help?" required/>
            </div>
            <div class="field">
              <label for="cMsg">Message</label>
              <textarea id="cMsg" name="message" placeholder="Write your message…" required></textarea>
            </div>
            <button class="button contact-submit-button" type="submit" disabled>
              <span>Send Message</span>
              
            </button>
          </form>
        </div>

      </div>
    </section>

  </main>

  <footer class="footer js-footer">
    <!-- Code to be injected by the JavaScript Footer component -->
  </footer>

  <script type="module" src="../js/main.js"></script>

</body>
</html>
